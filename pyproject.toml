[project]
name = "logi-mouse-map"
version = "0.1.0"
description = "Map the Logitech MX Master thumb button to a keyboard shortcut on macOS"
readme = "README.md"
authors = [
    { name = "David Gillespie", email = "david.gillespie@digital.cabinet-office.gov.uk" }
]
requires-python = ">=3.13"
dependencies = [
    "hidapi>=0.15.0",
    "pyobjc-framework-cocoa>=12.2.2",
    "pyobjc-framework-quartz>=12.2.2",
    "rumps>=0.4.0",
]

[project.scripts]
logi-mouse-map = "logi_mouse_map:main"

[build-system]
requires = ["uv_build>=0.11.17,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
